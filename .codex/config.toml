approval_policy = "never"
sandbox_mode = "danger-full-access"

model = "gpt-6.1-sol"
model_reasoning_effort = "xhigh"
plan_mode_reasoning_effort = "xhigh"
model_reasoning_summary = "none"
hide_agent_reasoning = true
model_verbosity = "low"
web_search = "live"

[tui]
animations = false
alternate_screen = "never"
vim_mode_default = true
status_line = ["model-with-reasoning", "current-dir", "thread-name", "git-branch", "branch-changes", "context-used", "weekly-limit", "hostname"]
status_line_use_colors = true

[analytics]
enabled = false

[feedback]
enabled = false

[projects."/workspace"]
trust_level = "trusted"
